<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marvel Champions</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e13;color:#cfd6e4;font:15px system-ui,sans-serif}
  #splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;padding:0 16px;text-align:center}
  h1{margin:0;font-size:28px;letter-spacing:.04em}
  #etat{opacity:.85;min-height:1.4em} progress{width:min(360px,80vw)}
  #detail{opacity:.5;font-size:12px;max-width:640px;white-space:pre-wrap}
  #erreur{color:#ff8a80;display:none;max-width:640px}
  iframe{border:0;width:100%;height:100%;display:none}
</style></head>
<body>
<div id="splash"><h1>Marvel Champions</h1><div id="etat">Preparation du moteur de jeu...</div>
  <progress id="bar"></progress><div id="detail"></div><div id="erreur"></div></div>
<iframe id="jeu" title="Jeu"></iframe>
<script type="module">
const N = 4 * 1024 * 1024;
// Meme cle que le jeu (public/js/prepare/langue.js) : l'habillage de play suit la langue choisie.
const EN = (() => { try { return localStorage.getItem("marvel-langue") === "en"; } catch (e) { return false; } })();
const tr = (fr, en) => (EN ? en : fr);
document.documentElement.lang = EN ? "en" : "fr";
document.getElementById("etat").textContent = tr("Preparation du moteur de jeu...", "Preparing the game engine...");
document.getElementById("jeu").title = tr("Jeu", "Game");
const $ = (id) => document.getElementById(id);
const erreur = (m) => { $("bar").style.display = "none"; $("erreur").style.display = "block"; $("erreur").textContent = m; };
// Adresse des tables du serveur (le site principal) quand on est sur play.<domaine>.
const site = location.hostname.startsWith("play.") ? location.origin.replace("//play.", "//") : "";
function panneau(titre, lignes, boutons) {
  $("splash").innerHTML = "";
  const h = document.createElement("h1"); h.textContent = titre; $("splash").append(h);
  lignes.forEach((l) => { const p = document.createElement("div"); p.style.maxWidth = "560px"; p.textContent = l; $("splash").append(p); });
  const rang = document.createElement("div"); rang.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px";
  boutons.forEach(([texte, action, href]) => { const e = document.createElement(href ? "a" : "button"); e.textContent = texte;
    e.style.cssText = "padding:10px 16px;border-radius:8px;border:1px solid #4a5568;background:#1f2937;color:#e5e7eb;font:inherit;cursor:pointer;text-decoration:none";
    if (href) e.href = href; else e.onclick = action; rang.append(e); });
  $("splash").append(rang);
}
const manques = [];
if (typeof WebAssembly === "undefined") manques.push("WebAssembly");
if (typeof Worker === "undefined") manques.push(tr("les processus d'arriere-plan (Web Worker)", "background workers (Web Worker)"));
if (!window.indexedDB) manques.push(tr("le stockage local (IndexedDB)", "local storage (IndexedDB)"));
if (typeof SharedArrayBuffer === "undefined" || !crossOriginIsolated) manques.push(tr("l'isolation de la page (SharedArrayBuffer)", "page isolation (SharedArrayBuffer)"));
const versTables = site ? [[tr("Jouer sur les tables du serveur", "Play on the server tables"), null, site]] : [];
if (manques.length) {
  panneau(tr("Ce navigateur ne peut pas lancer le jeu ici", "This browser cannot run the game here"),
    [tr("Il lui manque : ", "It is missing: ") + manques.join(", ") + ".",
     tr("Essaie une version recente de Chrome, Edge ou Firefox sur ordinateur, ou joue sur les tables du serveur.",
        "Try a recent version of Chrome, Edge or Firefox on a computer, or play on the server tables.")], versTables);
  throw new Error("capacites manquantes : " + manques.join(", "));
}
// Telephone ou tablette : le moteur demande ~300 Mo et plusieurs secondes de demarrage, et n'a pas ete eprouve.
if (matchMedia("(pointer: coarse)").matches && innerWidth < 900) {
  await new Promise((suite) => panneau(tr("Sur telephone, ce mode est experimental", "On a phone, this mode is experimental"),
    [tr("Le jeu tourne dans ton navigateur : il demande de la memoire et peut etre lent ou se fermer tout seul sur un telephone. Tes parties sont gardees dans ce navigateur.",
        "The game runs in your browser: it needs memory and may be slow or close by itself on a phone. Your games are kept in this browser.")],
    [[tr("Continuer quand meme", "Continue anyway"), () => suite()], ...versTables]));
  $("splash").innerHTML = '<h1>Marvel Champions</h1><div id="etat"></div><progress id="bar"></progress><div id="detail"></div><div id="erreur"></div>';
  $("etat").textContent = tr("Preparation du moteur de jeu...", "Preparing the game engine...");
}
// Presence en direct (admin du site, sous-onglet Play) : un identifiant aleatoire par onglet, en memoire
// seulement, envoye toutes les 60 s tant que la page est visible. Texte brut : pas de preflight CORS.
if (site) {
  let idPresence = null;
  try { idPresence = crypto.randomUUID(); } catch (e) { /* navigateur trop ancien : pas de presence */ }
  const signaler = () => {
    if (!idPresence || document.hidden) return;
    try { navigator.sendBeacon(site + "/presence_play", JSON.stringify({ id: idPresence })); } catch (e) { /* jamais bloquant */ }
  };
  signaler();
  setInterval(signaler, 60 * 1000);
  document.addEventListener("visibilitychange", signaler);
}
// Demande au navigateur de ne pas effacer les sauvegardes tout seul (quand il manque de place, ou apres des jours sans visite).
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then((ok) => { window.__persistant = ok; }).catch(() => {});

// --- sauvegardes du joueur : IndexedDB, ecrites par la page (le Worker est bloque, il ne peut pas)
const db = await new Promise((ok, ko) => { const r = indexedDB.open("marvel-navigateur", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("fichiers"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const tx = (mode) => db.transaction("fichiers", mode).objectStore("fichiers");
const demande = (r) => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const tout = async () => { const cles = await demande(tx("readonly").getAllKeys()), vals = await demande(tx("readonly").getAll());
  return cles.map((c, i) => [c, vals[i]]); };
const fichiers = await tout();

const ctrl = new Int32Array(new SharedArrayBuffer(16)), data = new Uint8Array(new SharedArrayBuffer(N)), enc = new TextEncoder();
function pousser(obj) {
  const b = enc.encode(JSON.stringify(obj)); const h = Atomics.load(ctrl, 0);
  for (let i = 0; i < 4; i++) data[(h + i) % N] = (b.length >>> (8 * i)) & 255;
  for (let i = 0; i < b.length; i++) data[(h + 4 + i) % N] = b[i];
  Atomics.store(ctrl, 0, h + 4 + b.length); Atomics.notify(ctrl, 0);
}
const attente = new Map(); let suivant = 1; const sockets = new Set(); let courant = null;
window.__moteur = {
  requete(methode, path, query, body) {
    return new Promise((res) => { const id = suivant++; attente.set(id, res); pousser({ type: "req", id, method: methode, path, query, body }); });
  },
  ouvrirWS(ws) { sockets.add(ws); courant = ws; setTimeout(() => { pousser({ type: "ws_open", url: location.origin.replace("http", "ws") + "/ws?" + (ws._q || "") }); ws._ouvert(); }, 0); },
  envoyerWS(t) { pousser({ type: "ws_msg", text: t }); },
  fermerWS(ws) { sockets.delete(ws); pousser({ type: "ws_close" }); },
  // Sauvegarde du joueur : un seul fichier JSON avec tout ce que le moteur a ecrit sous ./persist.
  async exporter() {
    pousser({ type: "sync" }); await new Promise((r) => setTimeout(r, 700));
    const fich = (await tout()).filter(([p]) => p.startsWith("/eng/persist/"));
    const enB64 = (u) => { let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
    const doc = { format: "marvel-champions-navigateur", version: 1, date: new Date().toISOString(), fichiers: Object.fromEntries(fich.map(([p, u]) => [p, enB64(u)])) };
    const lien = document.createElement("a");
    lien.href = URL.createObjectURL(new Blob([JSON.stringify(doc)], { type: "application/json" }));
    lien.download = "marvel-champions-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.append(lien); lien.click(); lien.remove(); setTimeout(() => URL.revokeObjectURL(lien.href), 5000);
    return fich.length;
  },
  async importer(fichier) {
    if (fichier.size > 30 * 1024 * 1024) throw new Error("fichier trop gros");
    let doc; try { doc = JSON.parse(await fichier.text()); } catch (e) { throw new Error("ce n'est pas un fichier d'export valide"); }
    if (!doc || doc.format !== "marvel-champions-navigateur" || typeof doc.fichiers !== "object") throw new Error("ce n'est pas un export de ce jeu");
    let n = 0;
    for (const [chemin, b64] of Object.entries(doc.fichiers)) {
      if (!/^\/eng\/persist\/[A-Za-z0-9_./ -]+\.json$/.test(chemin) || chemin.includes("..")) continue;
      const octets = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      await new Promise((ok, ko) => { const r = tx("readwrite").put(octets, chemin); r.onsuccess = ok; r.onerror = () => ko(r.error); });
      pousser({ type: "fichier", path: chemin, b64 }); n++;
    }
    return n;
  },
};
// le plateau passe son siege dans l'URL du socket : on la relaie telle quelle
const _ouvrir = window.__moteur.ouvrirWS;
window.__moteur.ouvrirWS = (ws) => { ws._q = (ws.url.split("?")[1] || ""); _ouvrir(ws); };

const VERSION = "__VERSION__";   // remplace par construire.py ; reste tel quel en developpement
const worker = new Worker("./moteur-worker.js?v=" + VERSION, { type: "module" });
worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "rep") {
    const r = JSON.parse(m.json), p = attente.get(r.id); if (!p) return; attente.delete(r.id);
    p(new Response(Uint8Array.from(atob(r.b64), (c) => c.charCodeAt(0)), { status: r.status, headers: { "Content-Type": r.ctype || "application/octet-stream" } }));
  } else if (m.type === "frame") { sockets.forEach((s) => s._recevoir(m.json)); }
  else if (m.type === "persist") {
    const r = JSON.parse(m.json);
    if (r.del) tx("readwrite").delete(r.path);
    else tx("readwrite").put(Uint8Array.from(atob(r.b64), (c) => c.charCodeAt(0)), r.path);
  } else if (m.type === "log") { $("detail").textContent = m.json; window.__log = (window.__log || []).concat(m.json); }
  else if (m.type === "erreur") erreur(tr("Le moteur n'a pas pu demarrer : ", "The engine could not start: ") + m.json.slice(0, 300));
  else if (m.type === "pret") {
    const p = new URLSearchParams(location.search).get("page") || "/prepare.html";
    $("jeu").src = p; $("jeu").style.display = "block"; $("splash").style.display = "none"; window.__pret = true;
    surveillerVersion();
  }
};
// Nouvelle version publiee : un bandeau discret propose de recharger (la partie en cours est sauvegardee automatiquement).
function surveillerVersion() {
  if (VERSION.startsWith("__")) return;
  const verifier = async () => {
    try {
      const v = (await (await fetch("/version.json", { cache: "no-store" })).json()).version;
      if (v && v !== VERSION && !document.getElementById("maj")) {
        const b = document.createElement("div"); b.id = "maj";
        b.style.cssText = "position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:99999;background:#1f2937;color:#e5e7eb;border:1px solid #4a5568;border-radius:10px;padding:10px 14px;font:14px system-ui;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.5)";
        b.append(tr("Une nouvelle version du jeu est disponible. Ta partie est sauvegardee automatiquement.",
          "A new version of the game is available. Your game is saved automatically."));
        const r = document.createElement("button"); r.textContent = tr("Recharger", "Reload"); r.style.cssText = "padding:6px 12px;border-radius:8px;border:0;background:#2563eb;color:#fff;font:inherit;cursor:pointer"; r.onclick = () => location.reload();
        const x = document.createElement("button"); x.textContent = tr("Plus tard", "Later"); x.style.cssText = "padding:6px 10px;border-radius:8px;border:1px solid #4a5568;background:transparent;color:inherit;font:inherit;cursor:pointer"; x.onclick = () => b.remove();
        b.append(r, x); document.body.append(b);
      }
    } catch (e) { /* hors ligne : on reessaiera */ }
  };
  setInterval(verifier, 10 * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) verifier(); });
}
worker.postMessage({ type: "init", ctrl: ctrl.buffer, data: data.buffer, fichiers });
</script></body></html>
