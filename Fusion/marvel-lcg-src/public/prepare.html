    <!-- Le tchat (reconstruit le 06/11/2026, apres son retrait du 12/09) :
         bundle React dedie, le meme composant que sur le plateau (VoletTchat,
         voir ui-app/src/prepare-chat.tsx). Une iframe plutot qu'un montage
         direct dans ce DOM non gere par Vite : les noms de fichiers buildes
         peuvent changer, l'iframe pointe juste vers la page.
         L'iframe reste TOUJOURS en plein viewport (position:fixed;inset:0) :
         c'est necessaire pour que le CSS interne du widget (VoletTchat.css,
         `position:fixed; bottom:...; right:0`, pense pour s'ancrer aux bords
         du VRAI viewport de la page, exactement comme sur le plateau) se
         positionne correctement — une iframe retaillee a la taille du widget
         casserait ces ancrages (le widget calculerait sa position par
         rapport aux bords d'une iframe haute de quelques dizaines de pixels
         au lieu des ~900px de la vraie page).
         Pour autant, une iframe pleine page avec `pointer-events:auto` en
         permanence bloquerait tous les clics de la page de preparation en
         dessous. Solution : l'iframe reste `pointer-events:none` par defaut
         (les clics la traversent vers prepare.html), et prepare-chat.tsx
         mesure en continu l'emprise reelle du widget (languette + panneau +
         fenetre detachee) et la transmet ici par postMessage ; ce script
         suit alors la position du curseur (souris ou tactile) sur CETTE
         page et bascule `pointer-events:auto` seulement quand le curseur
         est au-dessus du rectangle recu, pour que le widget redevienne
         cliquable pile a cet endroit, sans jamais changer sa taille/position
         reelle a l'ecran. -->
    <iframe id="tchat-iframe" src="/app/prepare-chat.html" title="Tchat"
            style="position:fixed;inset:0;width:100%;height:100%;
                   border:0;z-index:9500;background:transparent;pointer-events:none;"></iframe>
    <script>
      (function () {
        var iframe = document.getElementById('tchat-iframe')
        var rectWidget = null

        window.addEventListener('message', function (evenement) {
          if (evenement.origin !== window.location.origin) return
          if (!evenement.data) return
          // ⚠ CORRECTIF DE L'IMPASSE (06/11/2026). Ce document ne reçoit plus
          // AUCUN `mousemove` tant que l'iframe est en `pointer-events:auto` :
          // elle couvre tout le viewport, et un mouvement de souris au-dessus
          // va a SON document a elle, jamais au notre (les evenements ne
          // traversent pas une frontiere d'iframe). Sans ce message envoye
          // PAR l'iframe elle-meme des que son propre `mousemove` la voit
          // sortie du widget, plus aucun clic n'atteignait la vraie page tant
          // qu'on n'avait pas recharge — voir prepare-chat.tsx.
          if (evenement.data.type === 'marvel-tchat-hors-widget') {
            iframe.style.pointerEvents = 'none'
            return
          }
          if (evenement.data.type !== 'marvel-tchat-rect') return
          var rect = evenement.data.rect
          rectWidget = (rect && rect.width > 0 && rect.height > 0) ? rect : null
        })

        // Petite marge de tolerance : evite de "couper" le widget au pixel pres.
        var MARGE_PX = 4

        function dansLeRectangle(x, y) {
          if (!rectWidget) return false
          return x >= rectWidget.left - MARGE_PX && x <= rectWidget.left + rectWidget.width + MARGE_PX &&
                 y >= rectWidget.top - MARGE_PX && y <= rectWidget.top + rectWidget.height + MARGE_PX
        }

        function majPointerEvents(x, y) {
          iframe.style.pointerEvents = dansLeRectangle(x, y) ? 'auto' : 'none'
        }

        document.addEventListener('mousemove', function (evenement) {
          majPointerEvents(evenement.clientX, evenement.clientY)
        }, { passive: true })

        // Tactile : pas de survol, on verifie au point de contact avant que
        // le geste ne commence (meme logique que useGlisserPanneau.ts pour
        // unifier souris/tactile).
        document.addEventListener('touchstart', function (evenement) {
          var point = evenement.touches[0]
          if (!point) return
          majPointerEvents(point.clientX, point.clientY)
        }, { passive: true })
      })()
    </script>
