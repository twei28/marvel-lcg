<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/public/js/ui-version.js"></script>
    <title>Prepare a game — Marvel Champions</title>
    <!-- Pictos de l'en-tete (refonte du 7 septembre) : un emoji est dessine par
         le systeme, donc different sur chaque machine et jamais dans nos couleurs. -->
    <link rel="stylesheet" href="/public/css/font-awesome.css">
    <link rel="stylesheet" href="/public/css/prepare/prepare.css?v=bdabfb85">
    <link rel="stylesheet" href="/public/css/prepare/prepare-v2.css?v=1">
    <link rel="stylesheet" href="/public/css/prepare/selection-mechant.css?v=0957b00f">
    <link rel="stylesheet" href="/public/css/prepare/roue.css?v=1">
    <link rel="stylesheet" href="/public/css/prepare/arts-cartes.css?v=1">
    <link rel="stylesheet" href="/public/css/teinte-pages.css?v=1">
    <link rel="stylesheet" href="/public/css/affichage-sobre-pages.css?v=1">
    <link rel="stylesheet" href="/public/css/affichage-epure-pages.css?v=1">
    <link rel="stylesheet" href="/public/css/tel-pages.css?v=1">
    <link rel="stylesheet" href="/public/css/prepare/prepare-tel.css?v=4">
    <script type="module" src="/public/js/teinte-page.js?v=1"></script>
</head>
<body>
    <div id="app">
        <div class="loading" style="padding:60px;text-align:center">Loading…</div>
    </div>
    <script type="module" src="/public/js/prepare/app.js?v=85558b44"></script>
    <script src="/public/js/prepare/reprise.js?v=4" defer></script>
    <!-- Preavis du site (mise a jour imminente, coupure) : module autonome,
         il se pose tout seul en haut de l'ecran. Voir annonce.js. -->
    <script src="/public/js/prepare/annonce.js?v=1" defer></script>
    <!-- « Une mise a jour est arrivee » : un onglet laisse ouvert garde son
         JavaScript apres un deploiement, et les empreintes anti-cache ne
         servent qu'au PROCHAIN chargement. Module autonome, voir maj.js. -->
    <script src="/public/js/prepare/maj.js?v=1" defer></script>
    <!-- Pastille « un message t'attend » : rien ne s'affiche tant que personne
         n'ecrit. Ne remet pas le tchat retire le 12/09. Voir messages.js. -->
    <script src="/public/js/prepare/messages.js?v=1" defer></script>
    <!-- Invitations a la table d'un autre joueur (13/10/2026) : la fenetre
         « X t'invite a sa partie ». Module autonome, voir invitations.js. -->
    <script src="/public/js/prepare/invitations.js?v=1" defer></script>
    <!-- Bouton « 🃏 Galerie » : DEBRANCHE a la demande de l'utilisateur, la
         barre du haut etant trop chargee. lien-galerie.js reste dans
         js/prepare/ et /galerie.html reste servie (le salon y renvoie
         toujours) : decommenter cette ligne suffit a le rallumer.
    <script src="/public/js/prepare/lien-galerie.js?v=1" defer></script>
    -->
    <script src="/public/js/prepare/lien-admin.js?v=1" defer></script>
    <!-- « Mes signalements », pour tout le monde : la page vit sur le site, et
         l'ecran de jeu est servi depuis pN.<domaine>. Voir lien-signalements.js. -->
    <script src="/public/js/prepare/lien-signalements.js?v=1" defer></script>
    <script type="module" src="/public/js/prepare/panneau-bug.js"></script>
    <!-- Bouton et panneau « 🧩 Puzzles » : DEBRANCHES a la demande de
         l'utilisateur. puzzles.js reste dans js/prepare/, les routes du moteur
         (/list_puzzle_files, /load_puzzle) aussi : decommenter cette ligne
         suffit a les rallumer. -->
    <!-- Mention legale (10/10/2026) : ligne courte en pied de page, texte
         complet dans [data-mention-legale] s'il y en a un. Voir mention-legale.js. -->
    <script type="module" src="/public/js/mention-legale.js?v=1"></script>
</body>
</html>
