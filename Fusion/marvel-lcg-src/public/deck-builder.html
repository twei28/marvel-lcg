<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de deck — Marvel Champions</title>
    <link rel="stylesheet" href="/public/css/font-awesome.css">
    <link rel="stylesheet" href="/public/css/prepare/prepare.css?v=6f2394cf">
    <link rel="stylesheet" href="/public/css/deckbuilder.css?v=1">
    <link rel="stylesheet" href="/public/css/teinte-pages.css?v=1">
    <link rel="stylesheet" href="/public/css/affichage-sobre-pages.css?v=1">
    <link rel="stylesheet" href="/public/css/tel-pages.css?v=1">
    <script type="module" src="/public/js/teinte-page.js?v=1"></script>
</head>
<body class="db-body">
<header class="progress db-entete" id="db-entete"></header>
<main class="db-page">
    <aside class="db-col db-filtres-col" id="db-filtres-col">
        <nav class="db-rail" id="db-rail"></nav>
        <div class="db-filtres-corps">
            <div class="db-ftete">
                <span class="mvl db-ftitre" id="db-ftitre">Filtres</span>
                <button type="button" class="db-replier" id="db-replier">« Replier</button>
                <button type="button" class="db-fermer-panneau" data-fermer="filtres" aria-label="Fermer">✕</button>
            </div>
            <div id="db-filtres"></div>
        </div>
    </aside>
    <section class="db-col db-centre">
        <div id="db-legacy-zone"></div>
        <div class="db-barre">
            <label class="db-recherche-zone">
                <input id="db-recherche" class="db-recherche" type="search" autocomplete="off">
                <kbd>/</kbd>
            </label>
            <button type="button" class="db-aide" id="db-aide" aria-expanded="false">?</button>
            <label class="db-tri"><span id="db-tri-libelle">Tri :</span> <select id="db-tri-grille"></select></label>
        </div>
        <div class="db-aide-texte" id="db-aide-texte" hidden></div>
        <div class="db-info" id="db-info">
            <span id="db-grille-info"></span>
            <span class="db-etiquettes" id="db-etiquettes"></span>
            <span class="db-astuce" id="db-astuce"></span>
        </div>
        <div id="db-grille"></div>
    </section>
    <aside class="db-col db-deck-col" id="db-deck-col">
        <div class="db-dtete">
            <input id="db-nom" class="db-nom" type="text">
            <button type="button" class="db-ico" id="db-save-game"><i class="fa fa-floppy-o" aria-hidden="true"></i></button>
            <button type="button" class="db-ico" id="db-export"><i class="fa fa-download" aria-hidden="true"></i></button>
            <button type="button" class="db-ico" id="db-import"><i class="fa fa-upload" aria-hidden="true"></i></button>
            <input type="file" id="db-import-fichier" accept=".json,application/json" hidden>
            <button type="button" class="db-fermer-panneau" data-fermer="deck" aria-label="Fermer">✕</button>
        </div>
        <label class="db-partir"><span id="db-partir-libelle">Partir de :</span> <select id="db-partir"></select></label>
        <div id="db-status" role="status"></div>
        <div class="db-apercu-zone">
            <figure id="db-apercu"></figure>
            <div class="db-arts" id="db-arts"></div>
        </div>
        <div id="db-resume"></div>
        <div class="db-onglets" id="db-onglets" role="tablist"></div>
        <div id="db-deck"></div>
    </aside>
</main>
<div class="db-basmob">
    <button type="button" id="db-mob-filtres"></button>
    <button type="button" id="db-mob-deck" class="db-mob-deck"></button>
</div>
<div class="db-modale" id="db-modale" hidden></div>
<script type="module" src="/public/js/deckbuilder/app.js?v=2"></script>
</body>
</html>
