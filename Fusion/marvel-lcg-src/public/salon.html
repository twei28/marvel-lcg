<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marvel Champions — choisis ton héros</title>
    <!-- Refonte du 09/10/2026 : l'écran de l'invité reprend l'habillage de
         l'assistant (en-tête fin, scène à gauche, grille à droite). Tout le
         style vient de prepare.css ; salon.css n'ajoute que ce que l'assistant
         n'a pas (l'équipe en formation, l'import, l'avertissement). -->
    <link rel="stylesheet" href="/public/css/font-awesome.css">
    <link rel="stylesheet" href="/public/css/prepare/prepare.css?v=6f2394cf">
    <link rel="stylesheet" href="/public/css/prepare/prepare-v2.css?v=1">
    <link rel="stylesheet" href="/public/css/prepare/roue.css?v=1">
    <link rel="stylesheet" href="/public/css/salon.css?v=1">
    <link rel="stylesheet" href="/public/css/teinte-pages.css?v=1">
    <link rel="stylesheet" href="/public/css/affichage-sobre-pages.css?v=1">
    <script type="module" src="/public/js/teinte-page.js?v=1"></script>
</head>
<body>
    <div id="app">
        <!-- L'invité n'a accès à rien d'autre du jeu : le logo ne mène nulle
             part, et la galerie est la seule porte, pour qu'il puisse se
             documenter pendant qu'il choisit. -->
        <header class="progress" id="salon-barre"></header>
        <div class="layout accueil-layout">
            <main class="stage stage-affiche">
                <section class="step team-b salon-b" id="salon-b">
                    <div class="tb-scene" id="tb-scene">
                        <div id="salon-fond"></div>
                        <div id="salon-attente">
                            <b>Tu es prêt<span class="points"></span></b>
                            <span id="salon-attente-detail">En attente du lancement de la partie par l’hôte.</span>
                            <div class="salon-equipe" id="salon-equipe"></div>
                        </div>
                    </div>
                    <div class="tb-droite">
                        <div class="tb-entete">
                            <b class="mvl" id="salon-titre">Héros</b>
                            <span class="tb-compte" id="tb-compte"></span>
                            <span class="tb-mode" id="salon-entete"></span>
                        </div>
                        <p id="salon-statut"></p>
                        <section id="salon-roue" hidden></section>
                        <div id="salon-choix"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="/public/js/salon/app.js"></script>
    <script type="module" src="/public/js/prepare/panneau-bug.js"></script>
</body>
</html>
