<!-- Vent d'altitude : des trainees rapides qui filent a l'horizontale, pour
     le ciel au-dessus de la ville. -->
<style>
    /* Une iframe peint un canevas BLANC OPAQUE par defaut, et le plateau
       declare color-scheme: dark. Sans ces deux lignes, la couche pose une
       feuille opaque sur le jeu au lieu de le laisser voir. Voir rain.html. */
    html { color-scheme: dark; }
    html, body { background: transparent; }

    body { margin: 0; height: 100vh; overflow: hidden; }

    /* Une trainee, c'est un trait qui s'estompe aux deux bouts : un trait net
       ressemblerait a une barre qui glisse, pas a du vent. */
    .trainee {
        position: absolute;
        height: 1px;
        background: linear-gradient(to right,
            rgba(226, 238, 250, 0) 0%,
            rgba(226, 238, 250, 0.75) 45%,
            rgba(226, 238, 250, 0.9) 60%,
            rgba(226, 238, 250, 0) 100%);
        animation-name: file;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        will-change: transform;
    }

    /* Quelques nappes plus larges et floues passent en arriere-plan : sans
       elles on verrait des traits dans le vide, pas un ciel en mouvement. */
    .nappe {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(ellipse at center,
            rgba(214, 228, 244, 0.20) 0%,
            rgba(214, 228, 244, 0.08) 50%,
            rgba(214, 228, 244, 0) 78%);
        filter: blur(18px);
        animation-name: file;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        will-change: transform;
    }

    @keyframes file {
        from { transform: translateX(-120vw); }
        to   { transform: translateX(120vw); }
    }
</style>

<section class="ciel"></section>

<script>
    var nbTrainee = 90;
    var nbNappe = 7;

    function hasard(min, max) { return Math.random() * (max - min) + min; }

    var ciel = document.querySelector('.ciel');

    for (var i = 0; i < nbNappe; i++) {
        var n = document.createElement('div');
        n.className = 'nappe';
        n.style.width = hasard(30, 60) + 'vw';
        n.style.height = hasard(8, 20) + 'vh';
        n.style.top = hasard(-6, 92) + 'vh';
        var dn = hasard(26, 52);
        n.style.animationDuration = dn.toFixed(1) + 's';
        n.style.animationDelay = '-' + hasard(0, dn).toFixed(1) + 's';
        ciel.appendChild(n);
    }

    for (var j = 0; j < nbTrainee; j++) {
        var t = document.createElement('div');
        t.className = 'trainee';
        t.style.width = hasard(8, 34) + 'vw';
        t.style.top = hasard(0, 100).toFixed(2) + 'vh';
        t.style.opacity = hasard(0.25, 1).toFixed(2);
        // Les trainees les plus courtes vont le plus vite : c'est ce contraste
        // qui donne l'impression d'altitude plutot que de defilement uniforme.
        var duree = hasard(2.2, 6.5);
        t.style.animationDuration = duree.toFixed(2) + 's';
        t.style.animationDelay = '-' + hasard(0, duree).toFixed(2) + 's';
        ciel.appendChild(t);
    }
</script>
