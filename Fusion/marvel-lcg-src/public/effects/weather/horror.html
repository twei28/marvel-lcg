<!-- Horreur : brume verdatre au ras du sol et lumiere qui lache, pour le
     decor de vampires et de loups-garous du Mojoverse. -->
<style>
    /* Une iframe peint un canevas BLANC OPAQUE par defaut, et le plateau
       declare color-scheme: dark. Sans ces deux lignes, la couche pose une
       feuille opaque sur le jeu au lieu de le laisser voir. Voir rain.html. */
    html { color-scheme: dark; }
    html, body { background: transparent; }

    body { margin: 0; height: 100vh; overflow: hidden; }

    /* Les silhouettes sont NOIRES sur fond transparent, et le plateau est
       noir : posees telles quelles, elles seraient invisibles. C'est le halo
       vert qui les detache, exactement la lecon du symbiote. Elles sont aussi
       legerement translucides, pour qu'on devine le plateau au travers. */
    .branche {
        position: fixed;
        opacity: 0.9;
        filter: drop-shadow(0 0 7px rgba(120, 204, 134, 0.45));
        animation: balance 15s ease-in-out infinite;
        transform-origin: top center;
    }

    .b1 { top: -6vh; left: -6vw; width: 46vw; }
    .b4 { top: -8vh; right: -6vw; width: 48vw; transform: scaleX(-1); animation-delay: -5s; }
    /* Les deux suivantes sont plus petites et plus pales : elles creusent la
       profondeur derriere les deux premieres. */
    .b2 { top: 8vh; left: 14vw; width: 34vw; opacity: 0.55; animation-delay: -9s; }
    .b3 { top: 6vh; right: 12vw; width: 32vw; opacity: 0.5; transform: scaleX(-1); animation-delay: -3s; }

    @keyframes balance {
        0%, 100% { rotate: -0.7deg; }
        50%      { rotate: 0.7deg; }
    }

    /* La lumiere qui lache : elle assombrit tout par a-coups, puis revient.
       C'est ce clignotement, pas la brume, qui met mal a l'aise. */
    .lampe {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse 85% 80% at 50% 45%,
            rgba(0, 0, 0, 0) 0%,
            rgba(2, 8, 4, 0.30) 70%,
            rgba(1, 5, 2, 0.58) 100%);
        animation: lache 9s steps(1, end) infinite;
    }

    /* Les bancs sont bas et lourds : une brume d'horreur rampe, elle ne
       flotte pas a hauteur d'oeil comme celle des sous-sols. */
    .banc {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(ellipse at center,
            rgba(128, 218, 140, 0.44) 0%,
            rgba(102, 186, 116, 0.22) 45%,
            rgba(90, 160, 104, 0) 80%);
        filter: blur(30px);
        animation-name: rampe;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }

    @keyframes lache {
        0%, 76%, 100% { opacity: 1; }
        78%           { opacity: 0.25; }
        80%           { opacity: 1; }
        83%           { opacity: 0.4; }
        85%           { opacity: 1; }
    }

    @keyframes rampe {
        from { transform: translateX(-70vw); }
        to   { transform: translateX(170vw); }
    }
</style>

<!-- Branches fournies par l'utilisateur (silhouettes PNG de vhv.rs,
     telechargees en local : pointer vers le site casserait l'effet des que le
     jeu tourne hors ligne). Elles pendent depuis le haut, la ou elles ne
     genent pas la lecture des cartes. -->
<img class="branche b1" src="img/arbre1.png" alt="" aria-hidden="true">
<img class="branche b4" src="img/arbre4.png" alt="" aria-hidden="true">
<img class="branche b2" src="img/arbre2.png" alt="" aria-hidden="true">
<img class="branche b3" src="img/arbre3.png" alt="" aria-hidden="true">

<section class="crypte"></section>
<div class="lampe"></div>

<script>
    var nbBanc = 14;

    function hasard(min, max) { return Math.random() * (max - min) + min; }

    var crypte = document.querySelector('.crypte');
    for (var i = 0; i < nbBanc; i++) {
        var b = document.createElement('div');
        b.className = 'banc';
        var largeur = hasard(34, 70);
        b.style.width = largeur + 'vw';
        b.style.height = hasard(14, 30) + 'vh';
        // Au ras du sol, et debordant SOUS l'ecran : une brume qui s'arrete
        // net au bord se lit comme une bande, pas comme un sol noye.
        b.style.top = hasard(62, 108) + 'vh';
        b.style.opacity = hasard(0.5, 1).toFixed(2);
        var d = hasard(45, 95) + largeur;
        b.style.animationDuration = d.toFixed(1) + 's';
        b.style.animationDelay = '-' + hasard(0, d).toFixed(1) + 's';
        crypte.appendChild(b);
    }
</script>
