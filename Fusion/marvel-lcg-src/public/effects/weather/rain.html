<style>
    body {
        /* background: #0D343A; */
        /* background: linear-gradient(to bottom, rgba(13, 52, 58, 1), #000000); */
        overflow: hidden;
    }

    .drop {
        /* Le degrade partait d'un bleu-vert SOMBRE : sur un plateau sombre,
           et sous une iframe a 55 % d'opacite, la goutte etait invisible.
           Il part desormais du transparent vers du blanc franc. */
        background: linear-gradient(to bottom, rgba(190, 225, 235, 0) 0%, rgba(230, 245, 250, 0.95) 100%);
        width: 2px;
        height: 89px;
        position: absolute;
        bottom: 200px;
        animation: fall 0.63s linear infinite;
    }

    /* animate the drops */
    @keyframes fall {
        to {
            margin-top: 900px;
        }
    }
</style>

<section class="rain"></section>

<script>
    // number of drops created.
    var nbDrop = 250;

    // function to generate a random number range.
    function randRange(minNum,maxNum) {
        return (Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum);
    }

    // Function to generate drops
    function createRain() {
        for (let i = 1;i < nbDrop;i++) {
            // Toute la largeur de la fenetre, et non 1600 px en dur : sur un
            // ecran large, la droite de l'ecran restait seche.
            var dropLeft = randRange(0, window.innerWidth || 1600);
            var dropTop = randRange(-1000,1400);

            // Create a new div element
            var drop = document.createElement('div');
            drop.className = 'drop'; // Set the class name
            drop.id = 'drop' + i; // Set the id

            // Set the CSS styles for the drop
            drop.style.left = dropLeft + 'px';
            drop.style.top = dropTop + 'px';

            // Append the drop to the rain container
            document.querySelector('.rain').appendChild(drop);
        }
    }

    // Make it rain
    createRain();
</script>
