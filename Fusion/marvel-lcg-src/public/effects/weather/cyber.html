<!-- Cyber : la pluie de caracteres, pour le decor ou les ennemis sont des
     PROGRAMMES nommes Magneto 2.6. -->
<style>
    /* Une iframe peint un canevas BLANC OPAQUE par defaut, et le plateau
       declare color-scheme: dark. Sans ces deux lignes, la couche pose une
       feuille opaque sur le jeu au lieu de le laisser voir. Voir rain.html. */
    html { color-scheme: dark; }
    html, body { background: transparent; }

    body { margin: 0; height: 100vh; overflow: hidden; }

    .colonne {
        position: absolute;
        top: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "MS Gothic", "Yu Gothic", monospace;
        font-size: 17px;
        line-height: 1.06;
        color: rgba(64, 226, 120, 0.85);
        /* La colonne s'efface vers le HAUT : la trainee doit mourir derriere
           la tete, sinon on voit une bande de texte qui glisse. */
        -webkit-mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.35) 25%, rgba(0, 0, 0, 1) 100%);
        mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.35) 25%, rgba(0, 0, 0, 1) 100%);
        animation-name: descend;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        will-change: transform;
    }

    /* Le dernier caractere est la TETE de la colonne : presque blanc et
       auréolé. C'est lui qu'on suit des yeux, le reste n'est que sa trace. */
    .colonne span:last-child {
        color: #dcffe8;
        text-shadow: 0 0 8px rgba(150, 255, 190, 0.9);
    }

    @keyframes descend {
        from { transform: translateY(-100%); }
        to   { transform: translateY(100vh); }
    }
</style>

<section class="pluie"></section>

<script>
    // Katakana, chiffres et quelques signes : l'alphabet de la pluie.
    var SIGNES = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:.=*+-<>';

    function hasard(min, max) { return Math.random() * (max - min) + min; }
    function signe() { return SIGNES[Math.floor(Math.random() * SIGNES.length)]; }

    var pluie = document.querySelector('.pluie');
    var largeurColonne = 18;
    var nbColonne = Math.ceil(window.innerWidth / largeurColonne);
    var tous = [];

    for (var i = 0; i < nbColonne; i++) {
        var col = document.createElement('div');
        col.className = 'colonne';
        col.style.left = (i * largeurColonne) + 'px';
        col.style.opacity = hasard(0.35, 1).toFixed(2);
        var longueur = Math.round(hasard(8, 26));
        for (var j = 0; j < longueur; j++) {
            var s = document.createElement('span');
            s.textContent = signe();
            col.appendChild(s);
            tous.push(s);
        }
        var duree = hasard(4, 14);
        col.style.animationDuration = duree.toFixed(2) + 's';
        col.style.animationDelay = '-' + hasard(0, duree).toFixed(2) + 's';
        pluie.appendChild(col);
    }

    // Les caracteres changent en cours de chute. On n'en remue qu'une poignee
    // a la fois : tout redessiner a chaque image couterait cher pour un
    // resultat qu'on ne verrait pas mieux.
    setInterval(function () {
        for (var k = 0; k < 14; k++) {
            tous[Math.floor(Math.random() * tous.length)].textContent = signe();
        }
    }, 110);
</script>
