<!-- Sepia : la vieille pellicule, pour le western du Mojoverse. -->
<style>
    /* Une iframe peint un canevas BLANC OPAQUE par defaut, et le plateau
       declare color-scheme: dark. Sans ces deux lignes, la couche pose une
       feuille opaque sur le jeu au lieu de le laisser voir. Voir rain.html. */
    html { color-scheme: dark; }
    html, body { background: transparent; }

    body { margin: 0; height: 100vh; overflow: hidden; }

    /* Une iframe ne peut pas desaturer le plateau qui est DESSOUS : il n'y a
       pas de filtre qui traverse. Le sepia se fabrique donc par addition,
       une nappe brune et un vignettage, pas par un filter: sepia(). */
    .nappe {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 80% 74% at 50% 46%,
                rgba(206, 148, 72, 0.36) 0%,
                rgba(162, 110, 50, 0.28) 60%,
                rgba(96, 58, 22, 0.62) 100%),
            linear-gradient(to bottom,
                rgba(220, 164, 88, 0.22) 0%,
                rgba(158, 108, 50, 0.15) 100%);
        animation: papillote 0.9s steps(1, end) infinite;
    }

    /* Les rayures de pellicule : des traits verticaux clairs qui sautent
       d'une position a l'autre. C'est le detail qui dit « vieux film »
       plutot que « filtre orange ». */
    .rayure {
        position: absolute;
        top: -5vh;
        height: 110vh;
        width: 1px;
        background: linear-gradient(to bottom,
            rgba(255, 236, 200, 0) 0%,
            rgba(255, 236, 200, 0.5) 20%,
            rgba(255, 236, 200, 0.28) 70%,
            rgba(255, 236, 200, 0) 100%);
        animation-name: saute;
        animation-timing-function: steps(1, end);
        animation-iteration-count: infinite;
    }


    /* La lampe du projecteur n'est jamais parfaitement stable. */
    @keyframes papillote {
        0%, 100% { opacity: 1; }
        35%      { opacity: 0.88; }
        70%      { opacity: 0.95; }
    }

    @keyframes saute {
        0%   { opacity: 0; transform: translateX(0); }
        10%  { opacity: 1; }
        40%  { opacity: 1; transform: translateX(9px); }
        45%  { opacity: 0; }
        70%  { opacity: 0.8; transform: translateX(-14px); }
        100% { opacity: 0; transform: translateX(4px); }
    }

</style>

<section class="desert"></section>
<div class="nappe"></div>

<script>
    var nbRayure = 7;
    // Il n'y a plus de poussiere ici. Des particules qui traversaient
    // l'ecran de gauche a droite donnaient l'impression d'un vent, alors que
    // le sujet de cet effet est la PELLICULE, pas le desert : les deux
    // langages se contredisaient. La poussiere reste dans dust.html.

    function hasard(min, max) { return Math.random() * (max - min) + min; }

    var desert = document.querySelector('.desert');

    for (var i = 0; i < nbRayure; i++) {
        var r = document.createElement('div');
        r.className = 'rayure';
        r.style.left = hasard(2, 98).toFixed(1) + 'vw';
        r.style.opacity = hasard(0.3, 1).toFixed(2);
        var dr = hasard(1.6, 6);
        r.style.animationDuration = dr.toFixed(2) + 's';
        r.style.animationDelay = '-' + hasard(0, dr).toFixed(2) + 's';
        desert.appendChild(r);
    }

</script>
